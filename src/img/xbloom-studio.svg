<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" width="520" height="640" role="img" aria-label="رسم توضيحي لمكينة xBloom Studio">
<style>
.steam{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;opacity:0;animation:steam 4.2s ease-in-out infinite}
.s2{animation-delay:1.2s}.s3{animation-delay:2.4s}
.stream{stroke-dasharray:7 9;animation:flow .7s linear infinite}
.glow{animation:pulse 3.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(16px)}30%{opacity:.55}100%{opacity:0;transform:translateY(-46px)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.steam,.stream,.glow{animation:none}.steam{opacity:.3}}
</style>
<defs>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a302b"/><stop offset=".45" stop-color="#241d1a"/><stop offset="1" stop-color="#15100e"/></linearGradient>
<linearGradient id="arm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3d36"/><stop offset="1" stop-color="#1c1613"/></linearGradient>
<linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2f29"/><stop offset="1" stop-color="#120d0b"/></linearGradient>
<linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c98a"/><stop offset=".55" stop-color="#c8873a"/><stop offset="1" stop-color="#8a4f1f"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#f4e6cf" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
<linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a4a22"/><stop offset="1" stop-color="#3b1b0b"/></linearGradient>
<linearGradient id="hopper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d9ae" stop-opacity=".55"/><stop offset="1" stop-color="#b9763a" stop-opacity=".35"/></linearGradient>
<radialGradient id="dial" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#2d2420"/><stop offset="1" stop-color="#0d0908"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<ellipse cx="260" cy="606" rx="215" ry="18" fill="#2a140b" opacity=".28" filter="url(#soft)"/>
